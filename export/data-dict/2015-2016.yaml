name: nhanes
label: National Health and Nutrition Examination Survey (NHANES)
description: NCHS's survey of the health and nutrition of the US civilian noninstitutionalized population,
  combining interviews with physical examinations and laboratory tests at mobile examination centers.
  Released in two-year cycles of linked files.
